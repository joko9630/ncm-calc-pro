div class="foot">23종 도펀트 · 대표 산화물/수산화물/상용 수화물. SrO·BaO는 흡습/탄산화에 주의하세요. 기본 가정: 순수 NiₓCoᵧMnᵤ(OH)₂, LiOH·H₂O 및 도펀트 원료 순도 100%, 도펀트 전량 M-site 치환. 실제 소성 수율과 Li/O 손실은 반영하지 않습니다.</div></main><script>
const aw={Ni:58.6934,Co:58.9332,Mn:54.938044,Li:6.94,O:15.999,H:1.008,Ti:47.867,Zr:91.224,Nb:92.90637,Mo:95.95,W:183.84,Al:26.9815385,B:10.81,Ta:180.94788,Y:88.90584,La:138.90547,Ce:140.116,Sr:87.62,Ba:137.327,Sn:118.71,Ga:69.723,Na:22.98976928,Mg:24.305,Cr:51.9961,Sb:121.76,V:50.9415,Zn:65.38,Fe:55.845,Cu:63.546};

const chemicals={
Ti:[['TiO₂',{Ti:1,O:2}]],Zr:[['ZrO₂',{Zr:1,O:2}]],Nb:[['Nb₂O₅',{Nb:2,O:5}]],Mo:[['MoO₃',{Mo:1,O:3}]],W:[['WO₃',{W:1,O:3}]],

Ba:[['BaO',{Ba:1,O:1}],['Ba(OH)₂',{Ba:1,O:2,H:2}],['Ba(OH)₂·8H₂O',{Ba:1,O:10,H:18}]],
Sn:[['SnO₂',{Sn:1,O:2}]],
Ga:[['Ga₂O₃',{Ga:2,O:3}],['Ga(OH)₃',{Ga:1,O:3,H:3}]],
Na:[['NaOH',{Na:1,O:1,H:1}]],

Cu:[['CuO',{Cu:1,O:1}],['Cu(OH)₂',{Cu:1,O:2,H:2}]]};const MW=(obj)=>Object.entries(obj).reduce((a,[el,n])=>a+aw[el]*n,0);const LI_MW=MW({Li:1,O:2,H:3});const $=id=>document.getElementById(id);const fmt=(x,d=2)=>Number(x).toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});const num=(id)=>Number($(id).value);const finite=(...v)=>v.every(x=>Number.isFinite(x));let state={ts2:[{el:'Mo',raw:'MoO₃',pct:'0.5'}],os:[{el:'Mo',raw:'MoO₃',pct:'0.5'}]};
function baseInputs(k){return `<h3>Ni : Co : Mn 비율</h3><div class="grid3">${['Ni','Co','Mn'].map((e,i)=>`<div><label>${e}</label><input id="${k}-${e}" type="number" min="0" step="any" value="${[83,12,5][i]}" inputmode="decimal"></div>`).join('')}</div><div class="grid2" style="margin-top:13px"><div><label>${k==='ts2'?'TS1 가소성품 질량 (g)':'전구체 질량 (g)'}</label><input id="${k}-mass" type="number" min="0" step="any" value="150" inputmode="decimal"></div><div><label>${k==='os'?'최종 목표 Li/Me':'Li/Me ratio'+(k==='ts2'?' (TS1)':'')}</label><input id="${k}-ratio" type="number" min="0" step="any" value="1.03" inputmode="decimal"></div></div>`}
['li','ts2','os'].forEach(k=>{$(k+'-input').innerHTML=baseInputs(k)});function base(k){let v=['Ni','Co','Mn'].map(e=>num(k+'-'+e)),s=v.reduce((a,b)=>a+b,0),m=num(k+'-mass'),r=num(k+'-ratio');if(!finite(...v,m,r)||v.some(x=>x<0)||s<=0||m<=0||r<=0)return null;let mm=(v[0]*aw.Ni+v[1]*aw.Co+v[2]*aw.Mn)/s;return {m,r,mm,hydroxide: mm+MW({O:2,H:2}),metal:v.map(x=>x/s)}}
function renderDops(k){$(k+'-dops').innerHTML=state[k].map((d,i)=>`<div class="dop"><div><label>원소</label><select data-k="${k}" data-i="${i}" data-field="el">${Object.keys(chemicals).map(el=>`<option ${el===d.el?'selected':''}>${el}</option>`).join('')}</select></div><div><label>원료</label><select data-k="${k}" data-i="${i}" data-field="raw">${chemicals[d.el].map(([name])=>`<option ${name===d.raw?'selected':''}>${name}</option>`).join('')}</select></div><div><label>mol%</label><input data-k="${k}" data-i="${i}" data-field="pct" type="number" min="0" step="any" inputmode="decimal" value="${d.pct}"></div><button class="remove" data-remove="${k}" data-i="${i}" aria-label="삭제">×</button></div>`).join('')||'<p class="hint">도펀트가 없습니다. 필요하면 추가하세요.</p>'}
function getDops(k){let rows=state[k].map(d=>{let pct=Number(d.pct),formula=chemicals[d.el].find(([n])=>n===d.raw)?.[1];return {...d,pct,formula,atoms:formula?.[d.el]||0,mw:formula?MW(formula):NaN}});let d=rows.reduce((s,r)=>s+r.pct/100,0);if(rows.some(r=>!Number.isFinite(r.pct)||r.pct<0||!r.formula)||d>=1)return null;return {rows,d}}
function lines(items){return items.map(([a,b])=>`<div class="line"><span>${a}</span><strong>${b}</strong></div>`).join('')};function result(k,big,items,copy,note=''){ $(k+'-output').innerHTML=`<div class="result"><div class="hint">${k==='li'?'LiOH·H₂O 필요량':k==='ts2'?'최종 Li/Me ratio':'LiOH·H₂O 필요량'}</div><div class="big">${big}</div></div>${lines(items)}${note?`<p class="hint">${note}</p>`:''}<button class="btn" data-copy="${k}">계산 결과 복사</button>`;copies[k]=copy}
let copies={};function invalid(k,msg='입력값을 확인해 주세요. 도펀트 총량은 100 mol% 미만이어야 합니다.'){$(k+'-output').innerHTML=`<p class="error">${msg}</p>`;copies[k]=''}
function calc(k){let b=base(k);if(!b)return invalid(k,'전이금속 비율, 질량, Li/Me를 올바르게 입력해 주세요.');let ratio=['Ni','Co','Mn'].map(x=>$(k+'-'+x).value).join(':');if(k==='li'){let mol=b.m/b.hydroxide,li=mol*b.r*LI_MW;return result(k,`${fmt(li)} g`,[['전구체 분자량',`${fmt(b.hydroxide,3)} g/mol`],['전구체 몰수',`${fmt(mol,4)} mol`],['총 혼합 질량',`${fmt(b.m+li)} g`]],`Ni:Co:Mn = ${ratio}\n전구체 = ${b.m} g\nLi/Me = ${b.r}\nLiOH·H₂O = ${fmt(li)} g\n총 혼합 질량 = ${fmt(b.m+li)} g`)}let dop=getDops(k);if(!dop)return invalid(k);let {d,rows}=dop;if(k==='ts2'){// TS1 mass approximated as Li_r M O2, not actual phase / oxygen stoichiometry
let ts1Unit=b.mm+b.r*aw.Li+2*aw.O,nBase=b.m/ts1Unit,nTotal=nBase/(1-d),liFinal=b.r*(1-d);let weights=rows.map(x=>({...x,g:nTotal*x.pct/100/x.atoms*x.mw}));let items=[['도펀트 총량',`${fmt(d*100,3)} mol%`],['TS1 기준 Li/Me',fmt(b.r,4)],...weights.map(x=>[`${x.el} · ${x.raw} (${fmt(x.pct,3)} mol%)`,`${fmt(x.g,4)} g`]),['도펀트 원료 총량',`${fmt(weights.reduce((s,x)=>s+x.g,0),4)} g`]];let copy=`${new Date().toLocaleDateString('ko-KR')}\nTS2 | NCM ${ratio} / TS1 Li/Me ${b.r} / 가소성품 ${b.m} g\n${weights.map(x=>`${x.el} ${x.raw} (${fmt(x.pct,3)} mol%): ${fmt(x.g,4)} g`).join('\n')}\n최종 Li/Me: ${fmt(liFinal,4)}`;return result(k,fmt(liFinal,4),items,copy,'TS1 가소성품은 명목상 LiᵣMO₂로 가정하여 원래 NCM 금속 몰수를 역산합니다. 실제 TS1 중량 변화·잔류물에 따라 도펀트 투입량이 달라질 수 있습니다.')}
// OS: final Li/total metal ratio r, final metal includes dopants. N_total = N_base/(1-d)
let nBase=b.m/b.hydroxide,nTotal=nBase/(1-d),nLi=nTotal*b.r,li=nLi*LI_MW;let weights=rows.map(x=>({...x,g:nTotal*x.pct/100/x.atoms*x.mw}));let dopMass=weights.reduce((s,x)=>s+x.g,0);let metalMass=nBase*b.mm+rows.reduce((s,x)=>s+nTotal*x.pct/100*aw[x.el],0);let calcined=metalMass+nLi*aw.Li+2*aw.O*nTotal;let items=[['총 도펀트 함량',`${fmt(d*100,3)} mol%`],['최종 목표 Li/Me',fmt(b.r,4)],...weights.map(x=>[`${x.el} · ${x.raw} (${fmt(x.pct,3)} mol%)`,`${fmt(x.g,4)} g`]),['도펀트 원료 총량',`${fmt(dopMass,4)} g`],['예상 소성 후 질량',`${fmt(calcined,2)} g`]];let copy=`${new Date().toLocaleDateString('ko-KR')}\nNCM ${ratio} / Li/Me ${b.r} / 전구체 ${b.m} g\nLiOH·H₂O: ${fmt(li)} g\n${weights.map(x=>`${x.el} ${x.raw} (${fmt(x.pct,3)} mol%): ${fmt(x.g,4)} g`).join('\n')}\n예상 소성 후 질량: ${fmt(calcined)} g`;result(k,`${fmt(li)} g`,items,copy,'소성 후 질량은 명목상 LiᵣM총O₂ 화학식으로 산출한 이론값이며, 실제 산소 비화학양론·Li 손실·잔류 리튬은 반영하지 않습니다.')}
function all(){['li','ts2','os'].forEach(calc)}['ts2','os'].forEach(renderDops);all();document.addEventListener('input',e=>{let t=e.target;if(t.dataset.k&&t.dataset.field){state[t.dataset.k][Number(t.dataset.i)][t.dataset.field]=t.value;calc(t.dataset.k)}else if(t.id&&/^(li|ts2|os)-/.test(t.id))calc(t.id.split('-')[0])});document.addEventListener('change',e=>{let t=e.target;if(t.dataset.k&&t.dataset.field){let d=state[t.dataset.k][Number(t.dataset.i)];d[t.dataset.field]=t.value;if(t.dataset.field==='el'){d.raw=chemicals[d.el][0][0];renderDops(t.dataset.k)}calc(t.dataset.k)}});document.addEventListener('click',async e=>{let t=e.target;if(t.dataset.tab){document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===t));document.querySelectorAll('section').forEach(x=>x.classList.toggle('active',x.id===t.dataset.tab))}if(t.dataset.add){state[t.dataset.add].push({el:'Nb',raw:'Nb₂O₅',pct:'0.5'});renderDops(t.dataset.add);calc(t.dataset.add)}if(t.dataset.remove){state[t.dataset.remove].splice(Number(t.dataset.i),1);renderDops(t.dataset.remove);calc(t.dataset.remove)}if(t.dataset.copy){try{await navigator.clipboard.writeText(copies[t.dataset.copy]);t.textContent='복사 완료';setTimeout(()=>t.textContent='계산 결과 복사',1300)}catch(err){alert('복사 권한을 확인해 주세요.')}}});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
